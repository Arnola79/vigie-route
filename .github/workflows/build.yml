name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le projet
        run: |
          mkdir build
          unzip -q projet.zip -d build
          cp index.html build/app/src/main/assets/index.html
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/index.html" > build/app/src/main/assets/update_url.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: build
      - name: Compiler
        working-directory: build
        run: gradle assembleDebug --no-daemon
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Vigie Route (APK)
          body: Dernière version compilée. Téléchargez app-debug.apk.
          files: build/app/build/outputs/apk/debug/app-debug.apk
