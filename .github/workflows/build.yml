name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le projet
        run: |
          mkdir build
          unzip -q projet.zip -d build
          sed -i 's/abandonAudioFocus(focus)/abandonAudioFocusRequest(focus)/' build/app/src/main/java/fr/vigie/route/Sound.java
          cp index.html build/app/src/main/assets/index.html
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/index.html" > build/app/src/main/assets/update_url.txt
          NATIVE=$(sha256sum projet.zip | cut -c1-16)
          printf '%s' "$NATIVE" > build/app/src/main/assets/native.txt
          echo "NATIVE=$NATIVE" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: build
      - name: Compiler
        working-directory: build
        run: gradle assembleDebug --no-daemon -Pvcode=$((100 + GITHUB_RUN_NUMBER))
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Vigie Route (APK)
          body: Dernière version compilée. Téléchargez app-debug.apk.
          files: build/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier la version web et la version Android (GitHub Pages)
        run: |
          mkdir site && cp index.html site/index.html && touch site/.nojekyll
          printf '{"native":"%s","code":%d,"url":"https://github.com/%s/releases/download/apk/app-debug.apk"}' "$NATIVE" $((100 + GITHUB_RUN_NUMBER)) "${{ github.repository }}" > site/apk.json
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Version web, build n°${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
